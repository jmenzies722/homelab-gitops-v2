# Monitoring: kube-prometheus-stack (Prometheus, Alertmanager, Grafana,
# node-exporter, kube-state-metrics), tuned for a kind cluster on a laptop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.13.1          # pinned: upgrade by changing this line
    helm:
      valuesObject:
        # kind binds these control-plane parts to 127.0.0.1 inside the node,
        # so Prometheus can't scrape them. Skip them instead of firing false alerts.
        kubeEtcd: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeProxy: { enabled: false }

        prometheus:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts: [prometheus.localhost]
          prometheusSpec:
            retention: 3d
            # pick up ServiceMonitors from any app, not just this chart's
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 1Gi }

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }

        grafana:
          # admin password lives in Secret "grafana-admin", created by hand in the cluster.
          # (Letting the chart generate one makes Argo re-sync forever: new random value each render.)
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts: [grafana.localhost]
          persistence: { enabled: false }
          resources:                    # peak ~800Mi (startup/plugins)
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          sidecar:
            resources:                  # dashboard/datasource loaders, peak ~80Mi
              requests: { cpu: 10m, memory: 96Mi }
              limits: { memory: 192Mi }

        prometheusOperator:
          resources:                    # peak 53Mi
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          prometheusConfigReloader:
            resources:                  # sidecar in Prometheus & Alertmanager, peak ~28Mi
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 64Mi }

        kube-state-metrics:
          resources:                    # peak 42Mi
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }

        prometheus-node-exporter:
          hostRootFsMount: { enabled: false }   # OrbStack/kind nodes don't share the root mount
          resources:                    # peak 17Mi, one per node
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the Prometheus CRDs are too big for client-side apply
